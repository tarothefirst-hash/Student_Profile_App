<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile App</title>
    <script type="module"
    src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
    <script nomodule
    src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css">
</head>
<body>
    <ion-app>
        <ion-header>
            <ion-toolbar>
                <ion-title>Student Profile App</ion-title>
            </ion-toolbar>
        </ion-header>

        <ion-content class="ion-padding">
            <h2>Student Information</h2>
            <ion-item>
                <ion-input 
                id="studentName"
                label="Student Name"
                label-placement="floating"
                placeholder="Enter student name"></ion-input>
            </ion-item>

            <ion-item>
                <ion-input
                id="studentAge"
                type="number"
                label="Age"
                label-placement="floating"
                placeholder="Enter student age"></ion-input>
            </ion-item>

            <ion-item>
                <ion-input
                id="studentCourse"
                label="Course"
                label-placement="floating"  
                placeholder="Enter student course"></ion-input>
            </ion-item>

            <ion-button
            id="saveProfileButton"
            expand="block">Save Student Profile</ion-button>

            <h2>SAVED STUDENT PROFILE</h2>

            <div id="savedProfile">No student profile saved yet.</div><br>

            <ion-button
            id="deleteProfileButton"
            expand="block"
            color="danger">Delete Saved Student Profile</ion-button>

            <h2> API RESULT</h2>
            <div id="apiStatus">Loading from the server...</div>
            <div id="apiResults"></div>

            
        </ion-content>
    </ion-app>
    <script src="app.js"></script>
    
</body>
</html>
