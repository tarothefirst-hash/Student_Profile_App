name: Build APK
on:
push:
branches: [main, master]
workflow_dispatch:
Problem Fix
4 GB RAM laptop cannot run Android Studio,
Gradle and Cordova comfortably
Build on GitHub Actions with the same tools
instead of installing them locally
Build failed at the setup-android step Replaced it with a step that uses the
Android SDK already on GitHub's computer
and adds platform 36 and build-tools 36
Build file had a stray Yaml first line and
broken spacing
Cleared the editor with Ctrl + A, Delete,
then pasted again with the Copy button so
line 1 reads name: Build APK
Commit error: "A file with the same name
already exists"
The file was already saved on the first click,
so cancel and check the repo's file list
Messenger would not send the APK, or said
invalid file format
Used Google Drive or a USB cable to move
the APK to the phone
